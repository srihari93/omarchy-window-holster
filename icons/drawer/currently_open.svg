<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Desk Mounting Rail -->
  <line x1="3" y1="4" x2="21" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <!-- Exposed Descent Slide Rails -->
  <line x1="6" y1="4" x2="6" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="4" x2="18" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <line x1="7.5" y1="5.5" x2="7.5" y2="9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2" opacity="0.45" />
  <line x1="16.5" y1="5.5" x2="16.5" y2="9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2" opacity="0.45" />
  <!-- Pulled-Out / Descended Drawer Tray (Matching Width) -->
  <rect x="6" y="11" width="12" height="9.5" rx="1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="currentColor" fill-opacity="0.1" />
  <!-- Active Window Inside Drawer -->
  <line x1="8.5" y1="13.5" x2="15.5" y2="13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- Drawer Tray Handle -->
  <line x1="10" y1="16.5" x2="14" y2="16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
</svg>
