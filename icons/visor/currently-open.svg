<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Top Bezel Rail -->
  <line x1="3" y1="4" x2="21" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <!-- Descended Visor Console Window -->
  <rect x="5" y="4" width="14" height="15" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="currentColor" fill-opacity="0.08" />
  <!-- Titlebar Separator -->
  <line x1="5" y1="8" x2="19" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- Terminal Controls / Indicator Dots -->
  <circle cx="7.5" cy="6" r="0.65" fill="currentColor" />
  <circle cx="9.5" cy="6" r="0.65" fill="currentColor" />
  <!-- Active Terminal Console Prompt '> _' -->
  <path d="M8 11.5l2 1.5-2 1.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="12" y1="14.5" x2="15" y2="14.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
  <!-- Visor Pull / Stow Handle at Bottom -->
  <line x1="10.5" y1="19" x2="13.5" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
</svg>
